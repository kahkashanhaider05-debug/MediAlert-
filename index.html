<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediAlert - Medicine Reminder</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fc;
}

header{
    background:#008080;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:80%;
    max-width:600px;
    margin:30px auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
}

button{
    background:#008080;
    color:white;
    border:none;
    padding:10px 15px;
    cursor:pointer;
    border-radius:5px;
    margin-top:5px;
    margin-right:5px;
}

button:hover{
    background:#006666;
}

.delete-btn{
    background:red;
}

.delete-btn:hover{
    background:darkred;
}

.stop-btn{
    background:#ff9800;
}

.stop-btn:hover{
    background:#e68900;
}

ul{
    list-style:none;
    margin-top:20px;
}

li{
    background:#e8f5f5;
    padding:10px;
    margin-bottom:10px;
    border-radius:5px;
}
</style>
</head>

<body>

<header>
    <h1>MediAlert</h1>
    <p>Never Miss Your Medicine Again</p>
</header>

<div class="container">
<div class="card">

<h2>Add Medicine Reminder</h2>

<input type="text" id="medicine" placeholder="Medicine Name">

<input type="time" id="time">

<button onclick="addMedicine()">Add Reminder</button>

<button class="stop-btn" onclick="stopAlarm()">
Stop Alarm
</button>

<ul id="medicineList"></ul>

</div>
</div>

<!-- Suzume Ringtone -->
<audio id="alarmSound" loop>
    <source src="alarm.m4a" type="audio/mp4">
    Your browser does not support audio.
</audio>

<script>

let reminders =
JSON.parse(localStorage.getItem("reminders")) || [];

let notified = {};

displayMedicines();

function addMedicine(){

    let medicine =
    document.getElementById("medicine").value.trim();

    let time =
    document.getElementById("time").value;

    if(medicine === "" || time === ""){
        alert("Please fill all fields");
        return;
    }

    reminders.push({
        medicine: medicine,
        time: time
    });

    localStorage.setItem(
        "reminders",
        JSON.stringify(reminders)
    );

    displayMedicines();

    document.getElementById("medicine").value="";
    document.getElementById("time").value="";
}

function displayMedicines(){

    let list =
    document.getElementById("medicineList");

    list.innerHTML="";

    reminders.forEach((item,index)=>{

        let li =
        document.createElement("li");

        li.innerHTML = `
        <strong>${item.medicine}</strong><br>
        Reminder Time: ${item.time}<br><br>

        <button class="delete-btn"
        onclick="deleteReminder(${index})">
        Delete
        </button>
        `;

        list.appendChild(li);
    });
}

function deleteReminder(index){

    reminders.splice(index,1);

    localStorage.setItem(
        "reminders",
        JSON.stringify(reminders)
    );

    displayMedicines();
}

function stopAlarm(){

    let alarm =
    document.getElementById("alarmSound");

    alarm.pause();
    alarm.currentTime = 0;
}

setInterval(()=>{

    let now = new Date();

    let currentTime =
        now.getHours().toString().padStart(2,'0')
        + ":"
        + now.getMinutes().toString().padStart(2,'0');

    reminders.forEach(item=>{

        let key =
        item.medicine + item.time;

        if(item.time === currentTime &&
           !notified[key]){

            let alarm =
            document.getElementById("alarmSound");

            alarm.play().catch(() => {
                console.log("Audio blocked until user interaction.");
            });

            alert(
                "💊 Time to take your medicine: "
                + item.medicine
            );

            notified[key] = true;
        }
    });

},1000);

</script>

</body>
</html>
